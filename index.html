<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PinaTube</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
/* ---------- Intro estilo Netflix ---------- */
#intro { position: fixed; inset: 0; background: #000; z-index: 100;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    animation: introFade .7s ease 3.1s forwards; }
#intro.hide { animation: introFade .4s ease forwards; }
@keyframes introFade { to { opacity: 0; visibility: hidden; } }
.intro-arch { position: absolute; width: 62vmin; height: 62vmin; border-radius: 50%;
    border: 4px solid transparent; border-top-color: rgba(229,9,20,.85);
    filter: blur(7px); animation: archExpand 2.7s ease-out .3s both; }
.intro-arch.a2 { animation-delay: .55s; border-top-color: rgba(255,107,107,.7); }
@keyframes archExpand {
    from { transform: scale(.25) rotate(-40deg); opacity: 0; }
    40% { opacity: 1; }
    to { transform: scale(1.7) rotate(30deg); opacity: 0; } }
.intro-logo { font-size: clamp(52px, 13vw, 128px); font-weight: 900; letter-spacing: .05em;
    background: linear-gradient(100deg, #7a0b10 15%, #e50914 38%, #ffb3b3 50%, #e50914 62%, #7a0b10 85%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 32px rgba(229,9,20,.55));
    animation: sweep 2.3s ease-in-out .35s both, logoZoom 2.9s ease .2s both; }
@keyframes sweep { from { background-position: 210% 0; } to { background-position: -110% 0; } }
@keyframes logoZoom {
    from { transform: scale(.82); opacity: 0; letter-spacing: .32em; }
    35% { opacity: 1; }
    to { transform: scale(1); opacity: 1; letter-spacing: .05em; } }
.intro-skip { position: absolute; bottom: 34px; color: #5b6a8a; font-size: 13px;
    animation: skipIn .5s ease 1.2s both; }
@keyframes skipIn { from { opacity: 0; } to { opacity: 1; } }
/* ---------- Sitio ---------- */
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1420; color: #e8ecf4; min-height: 100vh; }
.topbar { display: flex; align-items: center; gap: 16px; padding: 14px 22px;
    background: #141b2d; border-bottom: 1px solid #232c44; position: sticky; top: 0; z-index: 10; }
.brand { font-size: 20px; font-weight: 800; color: #fff; }
.search { display: flex; gap: 6px; margin-left: auto; }
.search input { background: #0f1420; border: 1px solid #2c3652; color: #fff;
    border-radius: 8px; padding: 8px 12px; width: 220px; font-size: 14px; }
.search button { background: #2563eb; border: none; color: #fff; border-radius: 8px;
    padding: 8px 14px; cursor: pointer; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
.card { background: #182036; border-radius: 12px; overflow: hidden; cursor: pointer;
    border: 1px solid #232c44; transition: transform .15s; }
.card:hover { transform: translateY(-3px); }
.thumb { position: relative; aspect-ratio: 16/9;
    background: linear-gradient(135deg, #1d2a4a, #101828);
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb-ph { font-size: 44px; opacity: .7; }
.play { position: absolute; width: 52px; height: 52px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff; font-size: 20px;
    display: flex; align-items: center; justify-content: center; }
.card-body { padding: 12px 14px; }
.card-body h3 { font-size: 15px; color: #fff; margin-bottom: 4px; }
.card-body p { font-size: 13px; color: #9fb0cc; }
.empty { color: #9fb0cc; text-align: center; margin-top: 60px; }
.player-view { display: none; }
.player-box { background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 18px; }
.player-box video { width: 100%; max-height: 70vh; display: block; }
.back { display: inline-block; margin-bottom: 16px; color: #7cc4ff; cursor: pointer; font-size: 15px; }
.watch-title { font-size: 24px; margin-bottom: 8px; }
.watch-desc { color: #b9c4da; line-height: 1.6; white-space: pre-line; }
.foot { text-align: center; padding: 18px; color: #5b6a8a; font-size: 13px; }
@media (max-width: 640px) {
    .search input { width: 130px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
}
</style>
</head>
<body>
<div id="intro" onclick="skipIntro()" title="Clic para saltar">
    <div class="intro-arch"></div>
    <div class="intro-arch a2"></div>
    <div class="intro-logo">PinaTube</div>
    <div class="intro-skip">clic para saltar</div>
</div>
<header class="topbar">
    <span class="brand">🎬 PinaTube</span>
    <div class="search">
        <input type="text" id="q" placeholder="Buscar…" oninput="render()">
        <button onclick="render()">🔍</button>
    </div>
</header>

<main class="wrap">
    <div id="catalog">
        <div class="grid" id="grid"></div>
        <p class="empty" id="empty" style="display:none">No hay videos todavía.</p>
    </div>
    <div id="player" class="player-view">
        <span class="back" onclick="showCatalog()">← Volver al catálogo</span>
        <div class="player-box"><video id="vid" controls playsinline></video></div>
        <h1 class="watch-title" id="vtitle"></h1>
        <p class="watch-desc" id="vdesc"></p>
    </div>
</main>
<footer class="foot">PinaTube</footer>

<script>
function skipIntro() {
    const el = document.getElementById('intro');
    if (el) { el.classList.add('hide'); setTimeout(() => el.remove(), 450); }
}
setTimeout(() => { const el = document.getElementById('intro'); if (el) el.remove(); }, 4200);
let VIDEOS = [];
fetch('videos.json')
    .then(r => r.json())
    .then(d => { VIDEOS = d; render(); })
    .catch(() => { document.getElementById('empty').style.display = 'block'; });

function thumbHTML(v) {
    const img = v.poster
        ? `<img src="${v.poster}" alt="">`
        : `<span class="thumb-ph">🎬</span>`;
    return `<div class="thumb">${img}<span class="play">▶</span></div>`;
}
function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function render() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const list = VIDEOS.filter(v =>
        (v.title + ' ' + (v.description || '')).toLowerCase().includes(q));
    const grid = document.getElementById('grid');
    grid.innerHTML = list.map((v, i) => `
        <div class="card" onclick="play(${VIDEOS.indexOf(v)})">
            ${thumbHTML(v)}
            <div class="card-body"><h3>${esc(v.title)}</h3>
            ${v.description ? `<p>${esc(v.description.slice(0, 90))}</p>` : ''}</div>
        </div>`).join('');
    document.getElementById('empty').style.display = list.length ? 'none' : 'block';
}
function play(i) {
    const v = VIDEOS[i];
    document.getElementById('catalog').style.display = 'none';
    document.getElementById('player').style.display = 'block';
    document.getElementById('vtitle').textContent = v.title;
    document.getElementById('vdesc').textContent = v.description || '';
    const vid = document.getElementById('vid');
    vid.poster = v.poster || '';
    vid.src = v.file;
    vid.play().catch(() => {});
    window.scrollTo(0, 0);
}
function showCatalog() {
    document.getElementById('vid').pause();
    document.getElementById('player').style.display = 'none';
    document.getElementById('catalog').style.display = 'block';
}
</script>
</body>
</html>
