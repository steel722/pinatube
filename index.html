<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PinaTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --red: #e50914; --red-dark: #b00610; --bg: #0b0d12; --card: #161b26; --line: #232c44; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: #eef1f7; min-height: 100vh; }
h1, h2, .bebas { font-family: 'Bebas Neue', 'Inter', sans-serif; letter-spacing: .04em; }

/* ---------- Intro ---------- */
#intro { position: fixed; inset: 0; background: #000; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; cursor: pointer;
    animation: introFade .7s ease 3.4s forwards; }
#intro.hide { animation: introFade .4s ease forwards; }
@keyframes introFade { to { opacity: 0; visibility: hidden; } }
.intro-arch { position: absolute; width: 62vmin; height: 62vmin; border-radius: 50%;
    border: 4px solid transparent; border-top-color: rgba(229,9,20,.85);
    filter: blur(7px); animation: archExpand 2.7s ease-out .3s both; }
.intro-arch.a2 { animation-delay: .55s; border-top-color: rgba(255,107,107,.7); }
@keyframes archExpand {
    from { transform: scale(.25) rotate(-40deg); opacity: 0; }
    40% { opacity: 1; }
    to { transform: scale(1.7) rotate(30deg); opacity: 0; } }
.intro-img { width: min(40vmin, 300px); border-radius: 50%;
    filter: drop-shadow(0 0 46px rgba(255,120,20,.5));
    animation: logoImgIn 2.5s cubic-bezier(.2,.9,.25,1.2) .1s both; }
@keyframes logoImgIn {
    from { transform: scale(.5) rotate(-8deg); opacity: 0; }
    45% { opacity: 1; }
    to { transform: scale(1) rotate(0); opacity: 1; } }
.intro-logo { font-family: 'Bebas Neue', sans-serif; font-size: clamp(44px, 10vw, 96px); letter-spacing: .06em;
    background: linear-gradient(100deg, #7a0b10 15%, #e50914 38%, #ffb3b3 50%, #e50914 62%, #7a0b10 85%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 32px rgba(229,9,20,.55));
    animation: sweep 2.3s ease-in-out .35s both, logoZoom 2.9s ease .2s both; }
@keyframes sweep { from { background-position: 210% 0; } to { background-position: -110% 0; } }
@keyframes logoZoom {
    from { transform: scale(.82); opacity: 0; letter-spacing: .3em; }
    35% { opacity: 1; }
    to { transform: scale(1); opacity: 1; letter-spacing: .06em; } }
.intro-skip { position: absolute; bottom: 34px; color: #5b6a8a; font-size: 13px; animation: skipIn .5s ease 1.2s both; }
@keyframes skipIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Topbar ---------- */
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; gap: 20px; padding: 16px 34px;
    background: linear-gradient(180deg, rgba(0,0,0,.75), transparent);
    transition: background .3s; }
.topbar.solid { background: rgba(11,13,18,.92); backdrop-filter: blur(12px); border-bottom: 1px solid #1a2133; }
.brand { font-family: 'Bebas Neue', sans-serif; font-size: 34px; color: var(--red);
    letter-spacing: .06em; text-shadow: 0 2px 18px rgba(229,9,20,.45); user-select: none;
    display: flex; align-items: center; gap: 10px; }
.brand-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
    box-shadow: 0 0 14px rgba(255,120,20,.5); }
.search { display: flex; gap: 8px; margin-left: auto; }
.search input { background: rgba(255,255,255,.08); border: 1px solid #2c3652; color: #fff;
    border-radius: 20px; padding: 9px 16px; width: 230px; font-size: 14px; outline: none;
    transition: border-color .2s, width .25s; }
.search input:focus { border-color: var(--red); width: 280px; }
.search button { background: var(--red); border: none; color: #fff; border-radius: 50%;
    width: 38px; height: 38px; cursor: pointer; font-size: 15px; transition: transform .15s; }
.search button:hover { transform: scale(1.08); }

/* ---------- Hero ---------- */
.hero { position: relative; min-height: 62vh; display: flex; align-items: flex-end;
    overflow: hidden; margin-bottom: 8px; }
.hero-bg { position: absolute; inset: 0; background: linear-gradient(135deg, #2a0d12, #0b0d12 70%);
    display: flex; align-items: center; justify-content: center; }
.hero-bg img { width: 100%; height: 100%; object-fit: cover; animation: kenburns 24s ease-in-out infinite alternate; }
.hero-bg video { width: 100%; height: 100%; object-fit: cover; }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12); } }
.hero-bg .ph { font-size: 120px; opacity: .25; }
.hero-shade { position: absolute; inset: 0;
    background: linear-gradient(0deg, var(--bg) 4%, transparent 45%),
                linear-gradient(90deg, rgba(0,0,0,.72), transparent 60%); }
.hero-content { position: relative; padding: 40px 34px; max-width: 640px; z-index: 2; }
.hero-kicker { color: var(--red); font-weight: 800; font-size: 13px; letter-spacing: .22em;
    text-transform: uppercase; margin-bottom: 10px; }
.hero-title { font-size: clamp(44px, 7vw, 84px); line-height: .95; margin-bottom: 12px;
    text-shadow: 0 4px 30px rgba(0,0,0,.6); }
.hero-desc { color: #c3ccdf; font-size: 15.5px; line-height: 1.6; margin-bottom: 22px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.btn-row { display: flex; gap: 12px; }
.btn-play { background: var(--red); color: #fff; border: none; border-radius: 8px;
    padding: 13px 30px; font-size: 16px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; gap: 10px; transition: transform .15s, background .2s;
    box-shadow: 0 8px 28px rgba(229,9,20,.4); }
.btn-play:hover { background: #f6121d; transform: translateY(-2px); }

/* ---------- Filas ---------- */
.row { padding: 10px 34px 26px; }
.row h2 { font-size: 30px; margin-bottom: 14px; color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.card { position: relative; border-radius: 12px; overflow: hidden; cursor: pointer;
    background: var(--card); border: 1px solid transparent;
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s; }
.card:hover { transform: scale(1.045); z-index: 3;
    box-shadow: 0 14px 40px rgba(0,0,0,.55), 0 0 0 2px var(--red); }
.thumb { position: relative; aspect-ratio: 16/9; overflow: hidden;
    background: linear-gradient(135deg, #232f52, #0e1424); }
.thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
.card:hover .thumb img { transform: scale(1.06); }
.thumb video { width: 100%; height: 100%; object-fit: cover; }
.thumb-ph { font-size: 46px; opacity: .6; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; }
.thumb::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,.55), transparent 55%); opacity: 0; transition: opacity .25s; }
.card:hover .thumb::after { opacity: 1; }
.play { position: absolute; left: 50%; top: 50%; translate: -50% -50%; z-index: 2;
    width: 54px; height: 54px; border-radius: 50%; background: rgba(229,9,20,.92); color: #fff;
    font-size: 19px; display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(.7); transition: opacity .22s, transform .22s;
    box-shadow: 0 6px 22px rgba(229,9,20,.55); }
.card:hover .play { opacity: 1; transform: scale(1); }
.card-body { padding: 12px 14px 14px; }
.card-body h3 { font-size: 15px; font-weight: 700; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-body p { font-size: 12.5px; color: #8fa0bf; margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { color: #8fa0bf; text-align: center; margin: 70px 0; font-size: 16px; }

/* ---------- Reproductor ---------- */
#player { display: none; padding: 90px 34px 30px; max-width: 1100px; margin: 0 auto; }
.back { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px;
    color: #c3ccdf; cursor: pointer; font-size: 15px; font-weight: 600; }
.back:hover { color: #fff; }
.player-box { background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6); border: 1px solid #1c2438; }
.player-box video { width: 100%; max-height: 68vh; display: block; }
.watch-title { font-size: 40px; margin-bottom: 8px; }
.watch-desc { color: #b9c4da; line-height: 1.65; white-space: pre-line; margin-bottom: 30px; }

.foot { text-align: center; padding: 26px; color: #4d5a76; font-size: 13px;
    border-top: 1px solid #161d2e; margin-top: 20px; }
.foot b { color: var(--red); font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: .06em; }

@media (max-width: 640px) {
    .topbar { padding: 12px 16px; }
    .brand { font-size: 27px; }
    .search input { width: 130px; }
    .search input:focus { width: 150px; }
    .hero { min-height: 52vh; }
    .hero-content, .row, #player { padding-left: 16px; padding-right: 16px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
}
</style>
</head>
<body>

<div id="intro" onclick="skipIntro()" title="Clic para saltar">
    <div class="intro-arch"></div>
    <div class="intro-arch a2"></div>
    <img class="intro-img" src="logo.png" alt="PinaTube">
    <div class="intro-logo">PinaTube</div>
    <div class="intro-skip">clic para saltar</div>
</div>

<header class="topbar" id="topbar">
    <span class="brand"><img class="brand-logo" src="logo.png" alt="">PinaTube</span>
    <div class="search">
        <input type="text" id="q" placeholder="Buscar videos…" oninput="render()">
        <button onclick="render()" aria-label="Buscar">🔍</button>
    </div>
</header>

<main id="catalog">
    <section class="hero" id="hero" style="display:none">
        <div class="hero-bg" id="heroBg"></div>
        <div class="hero-shade"></div>
        <div class="hero-content">
            <div class="hero-kicker">★ Destacado</div>
            <h1 class="hero-title" id="heroTitle"></h1>
            <p class="hero-desc" id="heroDesc"></p>
            <div class="btn-row">
                <button class="btn-play" id="heroPlay">▶ Reproducir</button>
            </div>
        </div>
    </section>

    <section class="row">
        <h2>Mis videos</h2>
        <div class="grid" id="grid"></div>
        <p class="empty" id="empty" style="display:none">No hay videos todavía.</p>
    </section>
</main>

<div id="player">
    <span class="back" onclick="showCatalog()">← Volver</span>
    <div class="player-box" id="playerBox"></div>
    <h1 class="watch-title" id="vtitle"></h1>
    <p class="watch-desc" id="vdesc"></p>
    <section class="row" style="padding:0">
        <h2>Seguir viendo</h2>
        <div class="grid" id="nextGrid"></div>
    </section>
</div>

<footer class="foot"><b>PINATUBE</b> · tus videos, tu plataforma</footer>

<script>
function skipIntro() {
    const el = document.getElementById('intro');
    if (el) { el.classList.add('hide'); setTimeout(() => el.remove(), 450); }
}
setTimeout(() => { const el = document.getElementById('intro'); if (el) el.remove(); }, 4200);

window.addEventListener('scroll', () => {
    document.getElementById('topbar').classList.toggle('solid', window.scrollY > 40);
});

let VIDEOS = [];
fetch('videos.json')
    .then(r => r.json())
    .then(d => { VIDEOS = d; render(); })
    .catch(() => { document.getElementById('empty').style.display = 'block'; });

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function ytId(url) {
    const m = String(url || '').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
    return m ? m[1] : null;
}
function thumbHTML(v) {
    let inner;
    const yid = ytId(v.file);
    if (v.poster) {
        inner = `<img src="${esc(v.poster)}" alt="" loading="lazy">`;
    } else if (yid) {
        // Miniatura automática de YouTube
        inner = `<img src="https://i.ytimg.com/vi/${yid}/hqdefault.jpg" alt="" loading="lazy">`;
    } else {
        // Miniatura automática: primer frame del video
        inner = `<video muted preload="metadata" playsinline src="${encodeURI(v.file)}#t=0.5"></video>`;
    }
    return `<div class="thumb">${inner}<span class="play">▶</span></div>`;
}
function cardHTML(v) {
    const i = VIDEOS.indexOf(v);
    return `<div class="card" onclick="play(${i})">
        ${thumbHTML(v)}
        <div class="card-body"><h3>${esc(v.title)}</h3>
        ${v.description ? `<p>${esc(v.description)}</p>` : ''}</div>
    </div>`;
}
function render() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const list = VIDEOS.filter(v =>
        (v.title + ' ' + (v.description || '')).toLowerCase().includes(q));
    document.getElementById('grid').innerHTML = list.map(cardHTML).join('');
    document.getElementById('empty').style.display = list.length ? 'none' : 'block';

    const hero = document.getElementById('hero');
    if (VIDEOS.length && !q) {
        const f = VIDEOS[0];
        hero.style.display = 'flex';
        document.getElementById('heroTitle').textContent = f.title;
        document.getElementById('heroDesc').textContent = f.description || '';
        document.getElementById('heroDesc').style.display = f.description ? 'block' : 'none';
        const fyid = ytId(f.file);
        document.getElementById('heroBg').innerHTML = f.poster
            ? `<img src="${esc(f.poster)}" alt="">`
            : fyid
            ? `<img src="https://i.ytimg.com/vi/${fyid}/maxresdefault.jpg"
                   onerror="this.src='https://i.ytimg.com/vi/${fyid}/hqdefault.jpg'" alt="">`
            : `<video muted preload="metadata" playsinline src="${encodeURI(f.file)}#t=0.5"></video>`;
        document.getElementById('heroPlay').onclick = () => play(0);
    } else {
        hero.style.display = 'none';
    }
}
function play(i) {
    const v = VIDEOS[i];
    document.getElementById('catalog').style.display = 'none';
    document.querySelector('.foot').style.display = 'none';
    const p = document.getElementById('player');
    p.style.display = 'block';
    document.getElementById('vtitle').textContent = v.title;
    document.getElementById('vdesc').textContent = v.description || '';
    const box = document.getElementById('playerBox');
    const yid = ytId(v.file);
    if (yid) {
        box.innerHTML = `<iframe id="vid" src="https://www.youtube.com/embed/${yid}?rel=0"
            frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen style="width:100%;aspect-ratio:16/9;display:block"></iframe>`;
    } else {
        box.innerHTML = `<video id="vid" controls playsinline style="width:100%;max-height:68vh;display:block"></video>`;
        const vid = document.getElementById('vid');
        vid.poster = v.poster || '';
        vid.src = v.file;
        vid.play().catch(() => {});
    }
    document.getElementById('nextGrid').innerHTML =
        VIDEOS.filter((_, j) => j !== i).slice(0, 8).map(cardHTML).join('');
    window.scrollTo(0, 0);
}
function showCatalog() {
    const vid = document.getElementById('vid');
    if (vid) { if (vid.tagName === 'VIDEO') vid.pause(); else vid.src = ''; }
    document.getElementById('playerBox').innerHTML = '';
    document.getElementById('player').style.display = 'none';
    document.getElementById('catalog').style.display = 'block';
    document.querySelector('.foot').style.display = 'block';
    window.scrollTo(0, 0);
}
</script>
</body>
</html>
